<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KERNAL</title>
  <script>
    // SPA redirect for GitHub Pages — rafgraph/spa-github-pages
    // When GitHub Pages returns 404 for a deep URL like /learn/html/01-introduction,
    // this page encodes the path as a query param and redirects to the root,
    // where index.html recovers it and restores the history entry.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      '/?/' +
      l.pathname.slice(1).replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
